<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Tasks</title>

    <!-- Task 1: Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container p-4">

    <h1 class="text-center text-primary mb-4">
        Bootstrap Grid System
    </h1>

    <div class="row text-center">
        <div class="col-12 col-lg-4 p-3 bg-primary text-white">
            Column 1
        </div>

        <div class="col-12 col-lg-4 p-3 bg-success text-white">
            Column 2
        </div>

        <div class="col-12 col-lg-4 p-3 bg-danger text-white">
            Column 3
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12 col-lg-6 p-3 bg-light">
            <h3>Nested Columns</h3>

            <div class="row">
                <div class="col-6 p-2 bg-warning">
                    Sub-column 1
                </div>

                <div class="col-6 p-2 bg-info">
                    Sub-column 2
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6 p-3">
            <h3 class="text-primary">Typography</h3>
            <p class="text-center">
                Welcome to Bootstrap!
            </p>
            <p class="text-success">
                Bootstrap makes responsive design easy.
            </p>
        </div>
    </div>
</div>
</body>
</html>
