<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    // 1
    function add(a, b) {
    return a + b;
    }
    function calculate(num1, num2, callback) {
    return callback(num1, num2);
    }

    console.log(calculate(5, 3, add));

    // 2
    function welcome(name) {
    console.log("Welcome, " + name + "!");
    }

    function greetUser(name, callback) {
    callback(name);
    }
    
    greetUser("Arun kumar", welcome); 

    // 3
    function double(num) {
    return num * 2;
    }

    function processArray(arr, callback) {
     const result = [];
    for (let i = 0; i < arr.length; i++) {
    result.push(callback(arr[i]));
        }
    return result;
    }

    console.log(processArray([1, 2, 3, 4], double));

    // 4
    function isEven(num) {
    return num % 2 === 0;
    }

    function findNumber(arr, callback) {
    for (let i = 0; i < arr.length; i++) {
    if (callback(arr[i])) {
      return arr[i];  
        }
    }
     return "No even number found";
    }

    console.log(findNumber([1, 3, 4, 5, 7], isEven));

    // 5
    function isPositive(num) {
  return num >= 0;
    }

    function removeNegative(arr, callback) {
    const result = [];
    for (let i = 0; i < arr.length; i++) {
    if (callback(arr[i])) {
      result.push(arr[i]);
        }
    }
    return result;
    }

    console.log(removeNegative([1, -2, 3, -4, 5, 6], isPositive));

    // 6
    function showResult(isEligible) {
    if (isEligible) {
    console.log("You are eligible to vote.");
      } else {
    console.log("You are not eligible to vote.");
     }
    }

    function checkEligibility(age, callback) {
    callback(age >= 18);
    }

    checkEligibility(20, showResult); 
    checkEligibility(15, showResult); 
    </script>
</head>
<body>
     <h1>Welcome To Page</h1>  
</body>
</html>
